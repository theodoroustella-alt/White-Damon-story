<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOOrpos – φούτσαλ με την παρέα</title>
<style>
:root{--g:#1f6b2a;--g2:#3f9d3a;--lime:#c8f25a;--ink:#0d1b16;--card:#f4f8ec;--mut:#6b7a73;--red:#e5484d;--line:#d5e2c6}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--g);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--card);position:relative;padding-bottom:90px}
header{background:var(--g);color:#fff;padding:22px 20px 26px;background-image:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.05) 38px 76px)}
header .logo{font-weight:900;letter-spacing:.5px;font-size:15px;color:var(--lime)}
header h1{font-size:27px;line-height:1.1;margin-top:10px;font-weight:900}
header p{opacity:.8;margin-top:6px;font-size:14px}
main{padding:18px 20px}
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:16px 0 6px}
input,select{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--g2)}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:var(--lime);color:var(--ink);font-weight:900;font-size:17px;cursor:pointer;margin-top:22px}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--g);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--g);color:var(--g)}
.btn[disabled]{opacity:.45;cursor:default}
.price{background:var(--g);color:#fff;border-radius:14px;padding:14px 16px;margin-top:18px;display:flex;justify-content:space-between;align-items:center}
.price b{color:var(--lime);font-size:26px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-top:4px}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--g2);transition:width .3s}
.badge{display:inline-block;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:800}
.b-wait{background:#fff0c2;color:#7a5a00}.b-lock{background:var(--lime);color:var(--ink)}
h2{font-size:15px;margin:20px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.pl{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border:0}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-weight:800}
.pl.empty .av{background:transparent;border:2px dashed var(--line);color:var(--mut)}
.pl .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.pl.empty .n{color:var(--mut);font-weight:500}
.tag{white-space:nowrap;font-size:11px;font-weight:800;padding:4px 10px;border-radius:12px}
.t-paid{background:#d7f5c6;color:#1c5a0c}.t-pend{background:#ffe2e2;color:#9b1c1f}.t-q{background:#e8ecdc;color:#555}
.mini{border:0;background:#eee;border-radius:10px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer;margin-left:0;white-space:nowrap}
.mini.go{background:var(--g);color:#fff}
.sticky{position:fixed;bottom:0;width:100%;max-width:430px;background:var(--card);padding:12px 20px 18px;border-top:2px solid var(--line)}
.sticky .btn{margin:0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;font-weight:700;z-index:9;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.hint{font-size:12px;color:var(--mut);margin-top:16px;line-height:1.5;border-left:3px solid var(--lime);padding-left:10px}
.link{display:flex;gap:8px;align-items:center;background:#fff;border:2px dashed var(--g2);border-radius:12px;padding:10px 12px;font-size:13px;word-break:break-all}
a.back{color:var(--lime);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;text-align:left;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.seg button small{display:block;font-weight:500;color:var(--mut);margin-top:3px;font-size:12px}
.seg button.on{border-color:var(--g2);background:#e9f6df}
.sw{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;cursor:pointer;font-weight:700;font-size:14px}
.sw i{flex:none;width:44px;height:26px;border-radius:14px;background:#ccc;position:relative;transition:.2s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{background:var(--g2)}.sw.on i:after{left:21px}
.sw small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tg{font-size:12px;font-weight:800;padding:5px 10px;border-radius:14px;background:#e8ecdc;color:#2c4a1f}
.tg.f{background:#ffd9ec;color:#8a1b55}.tg.l{background:#ffe9b8;color:#6b4800}
.om{margin-bottom:12px}.om.dis{opacity:.55}
.om h3{font-size:16px}.om .why{font-size:13px;color:var(--red);font-weight:700;margin-top:8px}
.om .btn{margin-top:12px;padding:12px;font-size:15px}
.chip{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.chip a{color:var(--g2);font-weight:800;font-size:13px;cursor:pointer}
.steps{display:flex;gap:6px;margin:12px 0 4px}.steps i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}.steps i.on{background:var(--lime)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{text-align:left;padding:16px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:16px;cursor:pointer;color:var(--ink)}
.opt small{display:block;margin-top:4px;color:var(--mut);font-size:13px;font-weight:500}.opt.on{border-color:var(--g2);background:#e9f6df}
.sub{color:var(--mut);margin-bottom:10px;font-size:14px}
.map{width:100%;border-radius:14px;border:2px solid var(--line);display:block}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const H=(o,c)=>[o,c];
const VENUES=[
 {id:1,sport:"futsal",name:"Γήπεδο φούτσαλ Α",area:"Στρόβολος",price:60,lat:35.14,lon:33.34,sample:true,hours:{0:null,1:H("16:00","23:00"),2:H("16:00","23:00"),3:H("16:00","23:00"),4:H("16:00","23:00"),5:H("16:00","23:30"),6:H("09:00","23:30")}},
 {id:2,sport:"futsal",name:"Γήπεδο φούτσαλ Β",area:"Λευκωσία",price:55,lat:35.19,lon:33.40,sample:true,hours:{0:H("10:00","22:00"),1:null,2:H("17:00","23:00"),3:H("17:00","23:00"),4:H("17:00","23:00"),5:H("17:00","23:30"),6:H("10:00","23:30")}},
 {id:3,sport:"futsal",name:"Γήπεδο φούτσαλ Γ",area:"Παραλίμνι",price:50,lat:35.04,lon:33.98,sample:true,hours:{0:H("10:00","22:00"),1:H("15:00","23:00"),2:H("15:00","23:00"),3:H("15:00","23:00"),4:H("15:00","23:00"),5:null,6:H("10:00","23:00")}},
 {id:4,sport:"futsal",name:"Γήπεδο φούτσαλ Δ",area:"Λεμεσός",price:58,lat:34.69,lon:33.05,sample:true,hours:{0:H("14:00","23:30"),1:H("14:00","23:30"),2:H("14:00","23:30"),3:H("14:00","23:30"),4:H("14:00","23:30"),5:H("14:00","23:30"),6:H("06:00","23:30")}}];
VENUES.push(
 {id:5,sport:"basket",name:"Γήπεδο μπάσκετ Α",area:"Λευκωσία",price:40,lat:35.17,lon:33.36,sample:true,hours:{0:null,1:H("09:00","22:00"),2:H("09:00","22:00"),3:H("09:00","22:00"),4:H("09:00","22:00"),5:H("09:00","22:00"),6:H("09:00","20:00")}},
 {id:6,sport:"basket",name:"Γήπεδο μπάσκετ Β",area:"Λεμεσός",price:45,lat:34.70,lon:33.02,sample:true,hours:{0:H("10:00","20:00"),1:H("14:00","23:00"),2:H("14:00","23:00"),3:null,4:H("14:00","23:00"),5:H("14:00","23:00"),6:H("10:00","22:00")}},
 {id:7,sport:"basket",name:"Γήπεδο μπάσκετ Γ",area:"Λάρνακα",price:38,lat:34.92,lon:33.62,sample:true,hours:{0:H("10:00","20:00"),1:H("16:00","22:00"),2:H("16:00","22:00"),3:H("16:00","22:00"),4:H("16:00","22:00"),5:null,6:H("10:00","20:00")}});
const SP={
 futsal:{n:"Φούτσαλ",e:"⚽",art:"φούτσαλ",formats:[[10,"5 εναντίον 5 (10 παίχτες)"],[12,"6 εναντίον 6 (12 παίχτες)"],[8,"4 εναντίον 4 (8 παίχτες)"]]},
 basket:{n:"Μπάσκετ",e:"🏀",art:"μπάσκετ",formats:[[10,"5 εναντίον 5 (10 παίχτες)"],[8,"4 εναντίον 4 (8 παίχτες)"],[6,"3 εναντίον 3 (6 παίχτες)"]]}};
const cur=()=>(P&&P.sports&&P.sports.includes(P.sport))?P.sport:(P&&P.sports?P.sports[0]:"futsal");
const sportBar=()=>P.sports.length>1?`<div class="seg" style="margin-bottom:12px">${P.sports.map(s=>`<button data-sp="${s}" class="${cur()===s?"on":""}" style="min-width:0">${SP[s].e} ${SP[s].n}</button>`).join("")}</div>`:"";
const bindSportBar=fn=>document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{P.sport=b.dataset.sp;saveP();mapSel=null;fn()});
const DAYS=["Κυριακή","Δευτέρα","Τρίτη","Τετάρτη","Πέμπτη","Παρασκευή","Σάββατο"];
const todayHours=v=>v.hours[new Date().getDay()];
const FAKE=["Περτιτζιής Μιτσοστόμος","Περτίκα μουυυ","Περδικιός","Ανδρέας","Χαράλαμπος","Κυριάκος","Πάμπος","Στέλιος","Γιώργος","Νικόλας","Λάκης","Χρίστος","Μάριος"];
const FAKE_F=["Περτίκα μουυυ","Ελένη","Μαρίνα","Χριστίνα","Ανδρούλα","Σοφία","Κλαίρη","Μαρία","Έλλη","Νάσια"];
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let P=load("foorpos_me"),S=load("foorpos");
const save=()=>store("foorpos",S),saveP=()=>store("foorpos_me",P);
const $=h=>{document.getElementById("app").innerHTML=h};
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2400)};
const ini=n=>n.trim()[0].toUpperCase();
const fmt=v=>"€"+v.toFixed(2).replace(".00","");
const paidN=()=>S.players.filter(p=>p.paid).length;
const per=()=>S.venue.price/S.cap;
const locked=()=>paidN()===S.cap;
const tags=m=>`<div class="tags">${m.sport?`<span class="tg">${SP[m.sport].e} ${SP[m.sport].n}</span>`:""}<span class="tg ${m.mode==="level"?"l":""}">${m.mode==="level"?"🎯 Επίπεδο τακτικών":"😄 Για πλάκα"}</span>${m.womenOnly?'<span class="tg f">♀ Μόνο γυναίκες</span>':""}${m.open?'<span class="tg">🔓 Ανοιχτό ματς</span>':""}</div>`;
const modeTxt=m=>m==="level"?"Μόνο στο επίπεδο μου":"Για πλάκα";

/* ---- onboarding (3 οθόνες) ---- */
const LEVELS=[
 {v:"never",t:"Εν έχω παίξει ποτέ",d:"Θέλω απλά να δοκιμάσω"},
 {v:"fun",t:"Παίζω για πλάκα",d:"Ξέρω τα βασικά, εν με νοιάζει το επίπεδο"},
 {v:"pro",t:"Ξέρω μπάλα",d:"Παίζω τακτικά, θέλω ματς στο επίπεδο μου"}];
const SPORTS=[
 {v:"futsal",t:"Φούτσαλ",e:"⚽",d:"Ξεκινάμε από εδώ"},
 {v:"basket",t:"Μπάσκετ",e:"🏀",d:"Δεύτερο, ξεχωριστό από το φούτσαλ"}];
function onboarding(step=1,ob={name:"",level:"",sports:[]}){
 const bar=n=>`<div class="steps">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`;
 const back=step>1?`<a class="back" id="bk">← πίσω</a>`:`<div class="logo">⚽ FOOrpos</div>`;
 let body="",ttl="";
 if(step===1){ttl="Πώς σε λένε;";body=`<input id="nm" value="${ob.name}" placeholder="Το όνομα σου" autocomplete="off"><button class="btn" id="nx">Συνέχεια</button>`}
 if(step===2){ttl="Πόσο ξέρεις μπάλα;";body=`<div class="opts">${LEVELS.map(l=>`<button class="opt ${ob.level===l.v?"on":""}" data-v="${l.v}"><b>${l.t}</b><small>${l.d}</small></button>`).join("")}</div><button class="btn" id="nx">Συνέχεια</button>`}
 if(step===3){ttl="Τι σε ενδιαφέρει να παίξεις;";body=`<p class="sub">Διάλεξε ό,τι θες. Το κάθε άθλημα έχει δικά του γήπεδα και ματς.</p><div class="opts">${SPORTS.map(l=>`<button class="opt ${ob.sports.includes(l.v)?"on":""}" data-s="${l.v}"><b>${l.e} ${l.t}</b><small>${l.d}</small></button>`).join("")}</div><button class="btn" id="nx">Ξεκίνα</button>`}
 $(`<header>${back}${bar(step)}<h1>${ttl}</h1></header><main>${body}</main>`);
 if(step>1)bk.onclick=()=>onboarding(step-1,ob);
 if(step===1)nm.oninput=()=>ob.name=nm.value;
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ob.level=b.dataset.v;onboarding(step,ob)});
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const v=b.dataset.s;ob.sports=ob.sports.includes(v)?ob.sports.filter(x=>x!==v):[...ob.sports,v];onboarding(step,ob)});
 nx.onclick=()=>{
  if(step===1){if(!ob.name.trim())return toast("Γράψε το όνομα σου");ob.name=ob.name.trim();return onboarding(2,ob)}
  if(step===2){if(!ob.level)return toast("Διάλεξε μια επιλογή");return onboarding(3,ob)}
  if(!ob.sports.length)return toast("Διάλεξε τουλάχιστον ένα");
  P={name:ob.name,level:ob.level,sports:ob.sports,gender:"N",onlyWomen:false,mode:ob.level==="pro"?"level":"fun"};saveP();home();
 };
}

/* ---- επιλογές (φύλο, τρόπος παιχνιδιού) ---- */
function prefs(){
 const d={name:P.name,gender:P.gender,mode:P.mode,onlyWomen:P.onlyWomen};
 const draw=()=>{
  $(`<header><a class="back" id="bk">← αρχική</a><h1>Οι επιλογές σου</h1><p>Τα αλλάζεις όποτε θέλεις.</p></header>
  <main>
  <label>Το όνομα σου</label><input id="nm" value="${d.name}">
  <label>Είμαι</label>
  <div class="seg" id="gd"><button data-v="F" class="${d.gender==="F"?"on":""}">Γυναίκα</button><button data-v="M" class="${d.gender==="M"?"on":""}">Άντρας</button><button data-v="N" class="${d.gender==="N"?"on":""}">Προτιμώ να μεν πω</button></div>
  <label>Πώς θέλεις να παίζεις</label>
  <div class="seg" id="md">
   <button data-v="fun" class="${d.mode==="fun"?"on":""}">😄 Για πλάκα<small>Εν με νοιάζει το επίπεδο</small></button>
   <button data-v="level" class="${d.mode==="level"?"on":""}">🎯 Στο επίπεδο μου<small>Θέλω παίχτες σαν εμένα</small></button></div>
  ${d.gender==="F"?`<div class="sw ${d.onlyWomen?"on":""}" id="ow"><i></i><span>Παίζω μόνο με γυναίκες<small>Θα βλέπεις μόνο ματς με γυναίκες</small></span></div>`:""}
  <button class="btn" id="ok">Αποθήκευση</button></main>`);
  bk.onclick=home;nm.oninput=()=>d.name=nm.value;
  document.querySelectorAll("#gd button").forEach(b=>b.onclick=()=>{d.gender=b.dataset.v;if(d.gender!=="F")d.onlyWomen=false;draw()});
  document.querySelectorAll("#md button").forEach(b=>b.onclick=()=>{d.mode=b.dataset.v;draw()});
  const ow=document.getElementById("ow");if(ow)ow.onclick=()=>{d.onlyWomen=!d.onlyWomen;draw()};
  ok.onclick=()=>{if(!d.name.trim())return toast("Γράψε το όνομα σου");P={...P,...d,name:d.name.trim()};saveP();home()};
 };draw();
}

/* ---- χάρτης ---- */
const ISLAND=[[34.58,35.69],[34.3,35.58],[34.0,35.45],[33.3,35.34],[32.9,35.28],[32.6,35.19],[32.28,35.10],[32.30,34.95],[32.40,34.77],[32.70,34.66],[32.95,34.62],[33.2,34.68],[33.63,34.90],[34.07,34.96],[33.98,35.10],[34.25,35.25],[34.55,35.60]];
const CITIES=[["Λευκωσία",33.38,35.17],["Λεμεσός",33.03,34.68],["Λάρνακα",33.63,34.92],["Πάφος",32.42,34.77]];
const px=(lon,lat)=>[10+(lon-32.2)/2.5*340,10+(35.75-lat)/1.25*200];
let mapSel=null,onlyOpen=true;
function mapScreen(){
 const day=new Date().getDay();
 const sp=cur();const SV=VENUES.filter(v=>v.sport===sp);
 const list=SV.filter(v=>!onlyOpen||todayHours(v));
 const sel=SV.find(v=>v.id===mapSel);
 const poly=ISLAND.map(([lo,la])=>px(lo,la).map(n=>n.toFixed(1)).join(",")).join(" ");
 $(`<header><a class="back" id="bk">← αρχική</a><h1>Χάρτης · ${SP[sp].n}</h1><p>${DAYS[day]} · ${list.length} ανοιχτά σήμερα</p></header>
 <main>
 ${sportBar()}
 <div class="sw ${onlyOpen?"on":""}" id="oo" style="margin:0 0 12px"><i></i><span>Μόνο ανοιχτά σήμερα</span></div>
 <svg viewBox="0 0 360 220" class="map"><rect width="360" height="220" fill="#dff0f7"/><polygon points="${poly}" fill="#e9efd9" stroke="#9bb27a" stroke-width="1.5"/>
 ${CITIES.map(([n,lo,la])=>{const[x,y]=px(lo,la);return `<text x="${x}" y="${y+14}" font-size="8" fill="#6b7a73" text-anchor="middle">${n}</text>`}).join("")}
 ${SV.map(v=>{const[x,y]=px(v.lon,v.lat);const op=!!todayHours(v);if(onlyOpen&&!op)return"";return `<g data-p="${v.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${v.id===mapSel?9:6.5}" fill="${op?"#1f6b2a":"#999"}" stroke="#fff" stroke-width="2"/></g>`}).join("")}
 </svg><p class="hint" style="margin-top:8px">Σχηματικός χάρτης και <b>δείγμα</b> γηπέδων. Τα πραγματικά θα έρθουν από το Google Maps.</p>
 ${sel?`<div class="card om" style="margin-top:12px"><h3>${sel.name}</h3><div class="meta"><span>${sel.area}</span><span>${fmt(sel.price)}/ώρα</span></div>
  <p class="meta" style="margin-top:8px">${todayHours(sel)?`Σήμερα ${todayHours(sel)[0]} – ${todayHours(sel)[1]}`:"Κλειστό σήμερα"}</p>
  <button class="btn" id="mkh" ${todayHours(sel)?"":"disabled"}>Φτιάξε ματς εδώ</button></div>`:""}
 <h2>Ανοιχτά σήμερα</h2><div class="card" style="padding:4px 14px">${list.map(v=>`<div class="pl" data-l="${v.id}" style="cursor:pointer"><div class="av">${SP[sp].e}</div><div class="n">${v.name}<small style="display:block;color:var(--mut);font-weight:500">${v.area}</small></div><span class="tag t-paid">${todayHours(v)?todayHours(v).join("–"):"κλειστό"}</span></div>`).join("")||'<p class="meta" style="padding:14px 0">Κανένα ανοιχτό σήμερα.</p>'}</div>
 </main>`);
 bk.onclick=home;bindSportBar(mapScreen);oo.onclick=()=>{onlyOpen=!onlyOpen;mapScreen()};
 document.querySelectorAll("[data-p],[data-l]").forEach(g=>g.onclick=()=>{mapSel=+(g.dataset.p||g.dataset.l);mapScreen()});
 const m=document.getElementById("mkh");if(m)m.onclick=()=>create(sel.id);
}

/* ---- αρχική ---- */
function home(){
 if(!P||!P.sports)return onboarding();
 $(`<header><div class="logo">${SP[cur()].e} FOOrpos</div><h1>Πάμε ${SP[cur()].art};</h1><p>Κλείσε ματς ή μπες σε ματς που έχει ήδη θέση.</p></header>
 <main>
 ${sportBar()}
 <div class="chip"><div><b>${P.name}</b> <small style="color:var(--mut)">${(LEVELS.find(l=>l.v===P.level)||{t:""}).t}</small><div class="tags">${tags({mode:P.mode,womenOnly:P.onlyWomen})}</div></div><a id="ed">αλλαγή</a></div>
 ${S?`<div class="card"><b>Το ματς σου ${SP[S.sport||"futsal"].e}</b><div class="meta"><span>${S.venue.name}</span><span>${S.dayText||S.time}</span></div><button class="btn dark" id="cur" style="margin-top:12px;padding:12px;font-size:15px">Άνοιξε το</button></div>`:""}
 <button class="btn" id="mk">Φτιάξε ματς ${SP[cur()].art}</button>
 <button class="btn dark" id="fd">Βρες ανοιχτό ματς</button>
 <button class="btn ghost" id="mp">Χάρτης γηπέδων</button>
 <p class="hint">Εν έχεις παρέα ή σου λείπουν παίχτες; Μπες σε ανοιχτό ματς. Τα γήπεδα είναι ήδη κλεισμένα, οπότε εν παίρνεις τη θέση κανενός.</p></main>`);
 bindSportBar(home);ed.onclick=prefs;mk.onclick=()=>create();fd.onclick=openList;mp.onclick=mapScreen;
 const c=document.getElementById("cur");if(c)c.onclick=match;
}

/* ---- δημιουργία ---- */
function create(pre){
 let open=false;const sp=cur(),SV=VENUES.filter(v=>v.sport===sp);
 const draw=()=>{
 $(`<header><a class="back" id="back">← αρχική</a><h1>Φτιάξε ματς ${SP[sp].art}</h1>${tags({sport:sp,mode:P.mode,womenOnly:P.onlyWomen,open})}</header>
 <main>
 <label>Γήπεδο</label><select id="venue">${SV.map(v=>`<option value="${v.id}">${v.name} – ${v.area} (${fmt(v.price)}/ώρα)</option>`).join("")}</select>
 <div class="row"><div><label>Μέρα</label><input id="day" type="date"></div><div><label>Ώρα</label><input id="time" type="time" value="21:00"></div></div>
 <label>Πόσοι παίζετε</label>
 <select id="cap">${SP[sp].formats.map(([n,t],i)=>`<option value="${n}" ${i?"":"selected"}>${t}</option>`).join("")}</select>
 <div class="sw ${open?"on":""}" id="op"><i></i><span>Άνοιξε το ματς σε άλλες παρέες<small>Άλλοι με τις ίδιες επιλογές μπορούν να ζητήσουν θέση</small></span></div>
 <div class="price"><span>Μερίδιο ανά παίχτη</span><b id="pp"></b></div>
 <button class="btn" id="go">Φτιάξε το ${SP[sp].art}</button>
 <p class="hint">Το ματς παίρνει αυτόματα τις επιλογές σου (${modeTxt(P.mode)}${P.onlyWomen?", μόνο γυναίκες":""}).</p></main>`);
 const d=new Date();d.setDate(d.getDate()+2);day.value=d.toISOString().slice(0,10);
 const upd=()=>pp.textContent=fmt(VENUES.find(x=>x.id==venue.value).price/+cap.value);
 venue.onchange=cap.onchange=upd;if(pre)venue.value=pre;upd();
 back.onclick=home;op.onclick=()=>{open=!open;pre=+venue.value;const keep={v:venue.value,d:day.value,t:time.value,c:cap.value};draw();venue.value=keep.v;day.value=keep.d;time.value=keep.t;cap.value=keep.c;upd()};
 go.onclick=()=>{
  S={me:P.name,sport:sp,venue:VENUES.find(x=>x.id==venue.value),day:day.value,time:time.value,cap:+cap.value,
     players:[{name:P.name,paid:false}],wait:[],id:Math.random().toString(36).slice(2,7),
     open,mode:P.mode,womenOnly:P.onlyWomen};
  save();match();};
 };draw();
}

/* ---- ανοιχτά ματς ---- */
const OPEN=[
 {sport:"futsal",host:"4 άντρες",dayText:"Δευτέρα 20:00",venue:0,cap:8,players:["Ανδρέας","Χαράλαμπος","Κυριάκος","Πάμπος"],mode:"fun",womenOnly:false,note:"Μας λείπει αντίπαλη παρέα. Παίζουμε για πλάκα!"},
 {sport:"futsal",host:"5 κοπέλες",dayText:"Τετάρτη 19:00",venue:1,cap:10,players:["Ελένη","Μαρίνα","Χριστίνα","Ανδρούλα","Σοφία"],mode:"fun",womenOnly:true,note:"Μόνο κοπέλες, καθόλου πίεση."},
 {sport:"futsal",host:"Τακτικοί",dayText:"Πέμπτη 21:00",venue:0,cap:10,players:["Στέλιος","Γιώργος","Νικόλας","Λάκης","Χρίστος","Μάριος","Περδικιός"],mode:"level",womenOnly:false,note:"Ψάχνουμε 3 με καλό επίπεδο."},
 {sport:"futsal",host:"Παρέα Λεμεσού",dayText:"Παρασκευή 18:30",venue:2,cap:10,players:["Περτιτζιής Μιτσοστόμος","Πάμπος","Κυριάκος","Ανδρέας","Λάκης","Στέλιος"],mode:"fun",womenOnly:false,note:"Μεικτό, όποιος θέλει να κλωτσήσει."},
 {sport:"basket",host:"3 φίλοι",dayText:"Τρίτη 19:00",venue:4,cap:6,players:["Γιώργος","Νικόλας","Μάριος"],mode:"fun",womenOnly:false,note:"Ψάχνουμε 3 για να ρίξουμε λίγα καλαθάκια."},
 {sport:"basket",host:"4 κοπέλες",dayText:"Πέμπτη 18:00",venue:5,cap:8,players:["Ελένη","Μαρίνα","Χριστίνα","Σοφία"],mode:"fun",womenOnly:true,note:"Μόνο κοπέλες, χωρίς πίεση."},
 {sport:"basket",host:"Ομάδα πρωταθλήματος",dayText:"Δευτέρα 21:00",venue:6,cap:10,players:["Στέλιος","Λάκης","Χρίστος","Περδικιός","Ανδρέας","Πάμπος","Κυριάκος"],mode:"level",womenOnly:false,note:"Προπόνηση με παιχνίδι, ψάχνουμε 3 με επίπεδο."}];
function why(m){
 if(m.womenOnly&&P.gender!=="F")return "Μόνο για γυναίκες";
 if(P.onlyWomen&&!m.womenOnly)return "Εσύ επέλεξες να παίζεις μόνο με γυναίκες";
 if(m.mode!==P.mode)return m.mode==="level"?"Για τακτικούς παίχτες, εσύ θέλεις «για πλάκα»":"Είναι «για πλάκα», εσύ θέλεις μόνο το επίπεδο σου";
 return "";
}
function openList(){
 const sp=cur();const L=OPEN.filter(m=>m.sport===sp).map(m=>({m,r:why(m)})).sort((a,b)=>(a.r?1:0)-(b.r?1:0));
 const okN=L.filter(x=>!x.r).length;
 $(`<header><a class="back" id="back">← αρχική</a><h1>Ανοιχτά ματς ${SP[sp].art}</h1><p>${okN} ταιριάζουν με τις επιλογές σου</p>${tags({mode:P.mode,womenOnly:P.onlyWomen})}</header>
 <main>${L.map(({m,r},i)=>{const v=VENUES[m.venue];const free=m.cap-m.players.length;
  return `<div class="card om ${r?"dis":""}"><h3>${m.host} · ${m.dayText}</h3>
   <div class="meta"><span>${v.name}, ${v.area}</span><span>${fmt(v.price/m.cap)} ο καθένας</span></div>
   ${tags({...m,open:false})}<p class="meta" style="margin-top:10px">${m.note}</p>
   <p class="meta"><span><b>${m.players.length}/${m.cap}</b> παίχτες · ${free} ελεύθερες θέσεις</span></p>
   ${r?`<div class="why">🚫 ${r}</div>`:`<button class="btn" data-j="${OPEN.indexOf(m)}">Ζήτα θέση</button>`}</div>`}).join("")}
 <p class="hint">Τα ματς που δεν ταιριάζουν φαίνονται θαμπά με τον λόγο. Αλλάζεις επιλογές από την αρχική.</p></main>`);
 back.onclick=home;
 document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{
  const m=OPEN[+b.dataset.j];
  S={me:P.name,sport:m.sport,venue:VENUES[m.venue],dayText:m.dayText,time:m.dayText.split(" ")[1],cap:m.cap,
     players:[...m.players.map(n=>({name:n,paid:true})),{name:P.name,paid:false}],wait:[],id:Math.random().toString(36).slice(2,7),
     open:true,mode:m.mode,womenOnly:m.womenOnly,host:m.host};
  save();toast("Μπήκες στο ματς των «"+m.host+"»");match();});
}

/* ---- σελίδα ματς ---- */
function match(){
 const pn=paidN(),L=locked();
 const meP=S.players.find(p=>p.name===S.me);
 const dt=S.dayText||new Date(S.day+"T"+S.time).toLocaleDateString("el-GR",{weekday:"long",day:"numeric",month:"long"})+" · "+S.time;
 let rows=S.players.map((p,i)=>`<div class="pl"><div class="av">${ini(p.name)}</div><div class="n">${p.name}${p.name===S.me?" (εσύ)":""}</div>
   <span class="tag ${p.paid?"t-paid":"t-pend"}">${p.paid?"Πλήρωσε ✓":"Εκκρεμεί"}</span>
   ${!p.paid&&p.name!==S.me?`<button class="mini go" data-pay="${i}">πλήρωσε</button>`:""}
   ${p.name!==S.me?`<button class="mini" data-out="${i}">✕</button>`:""}</div>`).join("");
 for(let i=S.players.length;i<S.cap;i++)rows+=`<div class="pl empty"><div class="av">+</div><div class="n">Έσιει θέση</div></div>`;
 const wait=S.wait.map((n,i)=>`<div class="pl"><div class="av">${ini(n)}</div><div class="n">${n}</div><span class="tag t-q">αναμονή #${i+1}</span></div>`).join("");
 $(`<header><a class="back" id="back">← αρχική</a><h1>${S.venue.name}, ${S.venue.area}</h1><p>${dt} · ${S.cap} παίχτες</p>${tags(S)}</header>
 <main>
 <div class="card"><span class="badge ${L?"b-lock":"b-wait"}">${L?"🔒 Το γήπεδο κλείδωσε":"⏳ Περιμένουμε πληρωμές"}</span>
  <div class="bar"><i style="width:${pn/S.cap*100}%"></i></div>
  <div class="meta"><span>${pn} από ${S.cap} πλήρωσαν</span><span>${fmt(per())} ο καθένας</span></div>
  <p class="meta" style="margin-top:10px">${L?"Όλα έτοιμα. Τα λέμε στο γήπεδο!":"Κλειδώνει σαν πληρώσουν όλοι οι "+S.cap+"."}</p></div>
 <label>Link πρόσκλησης</label>
 <div class="link"><span style="flex:1">foorpos.cy/m/${S.id}</span><button class="mini go" id="share">Στείλε</button></div>
 <h2>Παίχτες (${S.players.length}/${S.cap})</h2><div class="card" style="padding:4px 14px">${rows}</div>
 ${S.wait.length?`<h2>Λίστα αναμονής</h2><div class="card" style="padding:4px 14px">${wait}</div>`:""}
 <button class="btn ghost" id="sim" style="margin-top:6px">+ Προσομοίωση: μπαίνει νέος παίχτης</button>
 <p class="hint">Πρωτότυπο: οι πληρωμές είναι ψεύτικες. Οι νέοι παίχτες της προσομοίωσης σέβονται τους κανόνες του ματς${S.womenOnly?" (εδώ μπαίνουν μόνο γυναίκες)":""}.</p>
 </main>
 ${meP&&!meP.paid?`<div class="sticky"><button class="btn dark" id="paybtn">Πλήρωσε το μερίδιο σου · ${fmt(per())}</button></div>`:""}`);
 back.onclick=home;
 share.onclick=()=>{const t=`${SP[S.sport||"futsal"].n} ${dt} στο ${S.venue.name}! ${fmt(per())} ο καθένας: foorpos.cy/m/${S.id}`;
  navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast("Αντιγράφτηκε το link"),()=>toast("Δεν αντιγράφτηκε")):toast("Δεν αντιγράφτηκε")};
 sim.onclick=()=>{
  const pool=S.womenOnly?FAKE_F:FAKE;const taken=[...S.players.map(p=>p.name),...S.wait];
  const n=pool.find(x=>!taken.includes(x));if(!n)return toast("Τελείωσαν τα ονόματα 🙂");
  if(S.players.length<S.cap){S.players.push({name:n,paid:false});toast(n+" μπήκε στο ματς")}
  else{S.wait.push(n);toast("Γεμάτο. Ο/η "+n+" πάει στην αναμονή")}
  save();match();};
 document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{
  S.players[+b.dataset.pay].paid=true;if(locked())toast("🔒 Όλοι πλήρωσαν. Κλείδωσε το γήπεδο!");save();match();});
 document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>{
  const gone=S.players.splice(+b.dataset.out,1)[0];
  if(S.wait.length){const n=S.wait.shift();S.players.push({name:n,paid:false});toast(gone.name+" εν έρκεται. Μπήκε ο/η "+n+" από την αναμονή")}
  else toast(gone.name+" εν έρκεται");
  save();match();});
 const pb=document.getElementById("paybtn");
 if(pb)pb.onclick=()=>{meP.paid=true;toast("Πλήρωσες "+fmt(per())+" ✓");if(locked())toast("🔒 Όλοι πλήρωσαν. Κλείδωσε το γήπεδο!");save();match();};
}
home();
</script>
</body>
</html>
